<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block finished</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self';" />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body class="notification-body">
    <div class="notification-card">
      <div class="window-header">
        <div class="window-title">Block finished</div>
      </div>
      <div>
        <div class="notification-label" id="finished-label">Finished</div>
        <p class="notification-message" id="finished-message">Your block has completed.</p>
      </div>
      <div class="notification-actions">
        <button id="ok-action-btn">Okay!</button>
      </div>
    </div>

    <script src="finished-notification.js"></script>
  </body>
</html>
