<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add block</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self';" />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body class="modal-body">
    <div class="modal-card add-block-modal-window">
      <div class="window-header modal-header">
        <div class="window-title">Add time block</div>
        <button id="close-window-btn" class="window-close-btn" title="Close window">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="block-type-selector">
        <label class="type-card">
          <input type="radio" name="block-type" value="task" checked />
          <div class="type-card-content">
            <span class="type-title">Task</span>
            <p>Focus on an active work item.</p>
          </div>
        </label>
        <label class="type-card">
          <input type="radio" name="block-type" value="break" />
          <div class="type-card-content">
            <span class="type-title">Break</span>
            <p>Rest and recharge between sessions.</p>
          </div>
        </label>
      </div>

      <div class="form-group">
        <label class="form-label" for="block-name">Block Name</label>
        <input id="block-name" class="form-input" placeholder="e.g. Code Review, Reading, Stretch" autofocus />
      </div>

      <div class="form-group">
        <label class="form-label" for="block-minutes">Duration (minutes)</label>
        <input id="block-minutes" class="form-input" type="number" min="1" max="360" value="25" />
      </div>

      <div class="modal-actions">
        <button id="cancel-btn" class="secondary-btn">Cancel</button>
        <button id="save-block-btn" class="primary-btn">Save block</button>
      </div>
    </div>

    <script src="add-block.js"></script>
  </body>
</html>
