<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="modal-body">
    <div class="modal-card settings-card-window">
      <div class="window-header settings-window-header">
        <div class="window-title">Settings</div>
        <button id="close-window-btn" class="window-close-btn settings-close-btn">
          <img src="assets/icons/close.png" alt="Close window" />
        </button>
      </div>

      <label class="settings-option">
        <div class="settings-option-header">
          <div class="settings-option-title">Auto-Start Task</div>
          <input id="auto-start-task" type="checkbox" />
        </div>
        <div class="settings-option-description">Automatically start the next block when the current one finishes.</div>
      </label>

      <label class="settings-option">
        <div class="settings-option-header">
          <div class="settings-option-title">Completion Sound</div>
          <input id="sound-enabled" type="checkbox" />
        </div>
        <div class="settings-option-description">Play audio chime when a task or break completes.</div>
      </label>

      <div class="settings-option">
        <div class="settings-option-header">
          <div class="settings-option-title">Chime Volume</div>
          <span id="volume-val" class="settings-badge">80%</span>
        </div>
        <input id="sound-volume" type="range" min="0" max="100" value="80" class="settings-range" />
      </div>

      <label class="settings-option">
        <div class="settings-option-header">
          <div class="settings-option-title">Desktop Notifications</div>
          <input id="native-notification" type="checkbox" />
        </div>
        <div class="settings-option-description">Show system desktop notifications when intervals finish.</div>
      </label>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
